<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ReDeal Product Details">
  <title>Product Details — ReDeal</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/product-detail.css">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.svg">
  <link rel="manifest" href="assets/manifest.json">
</head>
<body>
  <a href="#main" class="skip-link">Skip to main content</a>

  <header class="product-detail-header" role="banner">
    <div class="product-detail-header__inner">
      <a href="marketplace.html" class="product-detail-header__back" aria-label="Back to Marketplace">
        <svg class="icon icon--md" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        <span class="product-detail-header__back-text">Back</span>
      </a>
      <span class="product-detail-header__title">Product Details</span>
      <div class="header__auth"></div>
      <button class="product-detail-header__share" aria-label="Share product">
        <svg class="icon icon--md" width="24" height="24" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="18" cy="5" r="3"/>
          <circle cx="6" cy="12" r="3"/>
          <circle cx="18" cy="19" r="3"/>
          <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
          <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
        </svg>
      </button>
    </div>
  </header>

  <main id="main" class="main product-detail-main" role="main">
    <!-- Product content will be rendered by JS -->
    <div id="product-detail-container"></div>

    <!-- Not found state (hidden by default) -->
    <div class="product-not-found" id="product-not-found" hidden>
      <svg class="product-not-found__icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="11" cy="11" r="8"/>
        <path d="M21 21l-4.35-4.35"/>
      </svg>
      <h2 class="product-not-found__title">Product Not Found</h2>
      <p class="product-not-found__description">This product doesn't exist or may have been removed.</p>
      <a href="marketplace.html" class="btn btn--primary">Browse Marketplace</a>
    </div>
  </main>

  <footer class="footer" role="contentinfo">
    <nav class="bottom-nav" aria-label="Primary navigation">
      <a href="index.html" class="bottom-nav__item">
        <svg class="bottom-nav__icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <path d="M9 22V12h6v10"/>
        </svg>
        <span>Home</span>
      </a>
      <a href="marketplace.html" class="bottom-nav__item">
        <svg class="bottom-nav__icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="9" cy="21" r="1"/>
          <circle cx="20" cy="21" r="1"/>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
        </svg>
        <span>Marketplace</span>
      </a>
      <a href="requests.html" class="bottom-nav__item">
        <svg class="bottom-nav__icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <path d="M14 2v6h6"/>
          <path d="M16 13H8"/>
          <path d="M16 17H8"/>
          <path d="M10 9H8"/>
        </svg>
        <span>Requests</span>
      </a>
      <a href="messages.html" class="bottom-nav__item">
        <svg class="bottom-nav__icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        <span>Messages</span>
      </a>
      <a href="profile.html" class="bottom-nav__item">
        <svg class="bottom-nav__icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span>Profile</span>
      </a>
    </nav>
    <p class="footer__copyright">&copy; 2026 ReDeal. All rights reserved.</p>
  </footer>

  <script type="module">
  import { initHeader } from './js/components/Header.js';
  initHeader({});
</script>
  <script type="module" src="js/pages/ProductDetail.js"></script>
</body>
</html>
