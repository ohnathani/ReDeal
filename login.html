<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Log in to your ReDeal account">
  <title>Log In — ReDeal</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/login.css">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.svg">
  <link rel="manifest" href="assets/manifest.json">
</head>
<body>
  <a href="#main" class="skip-link">Skip to main content</a>

  <header class="header" role="banner">
    <div class="header__topbar">
      <nav class="header__nav" aria-label="Primary navigation">
        <a href="index.html" class="header__nav-link">Home</a>
        <a href="marketplace.html" class="header__nav-link">Marketplace</a>
        <a href="requests.html" class="header__nav-link">Requests</a>
        <a href="messages.html" class="header__nav-link">Messages</a>
        <a href="profile.html" class="header__nav-link">Profile</a>
      </nav>
    </div>
  </header>

  <main id="main" class="main auth-main" role="main">
    <div class="auth-card">
      <header class="auth-card__header">
        <a href="index.html" class="auth-card__back" aria-label="Back to Home">
          <svg class="icon icon--md" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
          <span>Back</span>
        </a>
        <h1 class="auth-card__title">Welcome back</h1>
        <p class="auth-card__subtitle">Log in to your ReDeal account</p>
      </header>

      <form id="login-form" class="auth-form" novalidate>
        <div class="form-group">
          <label for="email" class="form-label">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            class="form-input"
            placeholder="you@example.com"
            required
            autocomplete="email"
            aria-describedby="email-error"
          >
          <span id="email-error" class="form-error" role="alert" hidden></span>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <div class="form-input-wrapper">
            <input
              type="password"
              id="password"
              name="password"
              class="form-input"
              placeholder="••••••••"
              required
              autocomplete="current-password"
              aria-describedby="password-error"
            >
            <button type="button" class="form-input-toggle" aria-label="Show password" data-toggle-target="password">
              <svg class="icon icon--sm" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
          <span id="password-error" class="form-error" role="alert" hidden></span>
        </div>

        <div class="form-group form-group--inline">
          <label class="form-check" for="remember-me">
            <input type="checkbox" id="remember-me" name="rememberMe" class="form-check-input">
            <span class="form-check-label">Remember me</span>
          </label>
          <a href="#" class="form-link" id="forgot-password-link">Forgot password?</a>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn--primary btn--block btn--lg" id="submit-btn" disabled>
            <span class="btn__text">Log In</span>
            <span class="btn__loading" hidden>
              <svg class="spinner" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10" stroke-opacity="0.25"/>
                <path d="M12 2a10 10 0 0 1 10 10" stroke-linecap="round"/>
              </svg>
              <span>Signing in...</span>
            </span>
          </button>
        </div>
      </form>

      <div class="auth-card__divider">
        <span>or</span>
      </div>

      <button type="button" class="btn btn--secondary btn--block demo-bypass" id="demo-bypass-btn">
        <svg class="btn__icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span>Continue as Guest</span>
      </button>

      <footer class="auth-card__footer">
        <p>Don't have an account? <a href="signup.html" class="form-link">Sign up</a></p>
      </footer>
    </div>
  </main>

  <footer class="footer" role="contentinfo">
    <nav class="bottom-nav" aria-label="Primary navigation">
      <a href="index.html" class="bottom-nav__item">
        <svg class="bottom-nav__icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <path d="M9 22V12h6v10"/>
        </svg>
        <span>Home</span>
      </a>
      <a href="marketplace.html" class="bottom-nav__item">
        <svg class="bottom-nav__icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="9" cy="21" r="1"/>
          <circle cx="20" cy="21" r="1"/>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
        </svg>
        <span>Marketplace</span>
      </a>
      <a href="requests.html" class="bottom-nav__item">
        <svg class="bottom-nav__icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <path d="M14 2v6h6"/>
          <path d="M16 13H8"/>
          <path d="M16 17H8"/>
          <path d="M10 9H8"/>
        </svg>
        <span>Requests</span>
      </a>
      <a href="messages.html" class="bottom-nav__item">
        <svg class="bottom-nav__icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        <span>Messages</span>
      </a>
      <a href="profile.html" class="bottom-nav__item">
        <svg class="bottom-nav__icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span>Profile</span>
      </a>
    </nav>
    <p class="footer__copyright">&copy; 2026 ReDeal. All rights reserved.</p>
  </footer>

  <script type="module" src="js/pages/Login.js"></script>
</body>
</html>
