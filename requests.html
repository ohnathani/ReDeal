<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Requests — ReDeal (standalone preview)</title>
<style>
:root{
  --color-primary:#5E17EB;--color-primary-hover:#4710BD;--color-primary-light:#8755F5;
  --color-lavender:#EEE7FF;--color-lavender-soft:#F8F5FF;
  --color-background:#F7F6FA;--color-surface:#FFFFFF;--color-text:#191522;
  --color-text-secondary:#777180;--color-text-muted:#A39EAD;
  --color-border:#EAE7F0;--color-border-strong:#D8D1E5;
  --color-accent-mint:#20C997;--color-accent-yellow:#FFC857;
  --color-success:#16865F;--color-error:#DC3545;--color-error-bg:#FDECEE;--color-on-primary:#FFFFFF;
  --space-xs:.25rem;--space-sm:.5rem;--space-md:1rem;--space-lg:1.5rem;--space-xl:2rem;--space-2xl:3rem;
  --font-sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --text-xs:.75rem;--text-sm:.875rem;--text-base:1rem;--text-lg:1.125rem;--text-xl:1.25rem;--text-2xl:1.5rem;--text-3xl:2rem;
  --radius-sm:.25rem;--radius-md:.5rem;--radius-lg:.75rem;--radius-xl:1rem;--radius-full:9999px;
  --shadow-sm:0 1px 2px rgb(0 0 0/.05);--shadow-md:0 4px 6px -1px rgb(0 0 0/.1);
  --transition-fast:150ms ease;--transition-base:250ms ease;
}
*{box-sizing:border-box;margin:0}
body{font-family:var(--font-sans);background:var(--color-background);color:var(--color-text);line-height:1.5}
.skip-link{position:absolute;left:-999px}
.header{background:var(--color-surface);border-bottom:1px solid var(--color-border)}
.header__topbar{display:flex;align-items:center;justify-content:space-between;gap:var(--space-md);padding:var(--space-md) var(--space-lg);max-width:72rem;margin:0 auto}
.header__logo{font-weight:800;font-size:var(--text-xl);color:var(--color-primary);text-decoration:none}
.header__nav{display:flex;gap:var(--space-lg)}
.header__nav-link{color:var(--color-text-secondary);text-decoration:none;font-weight:600;padding-bottom:4px}
.header__nav-link[aria-current="page"]{color:var(--color-primary);border-bottom:2px solid var(--color-primary)}
.header__search{max-width:72rem;margin:0 auto;padding:0 var(--space-lg) var(--space-md)}
.header__search-input{width:100%;min-height:44px;padding:0 var(--space-lg);border:1px solid var(--color-border);border-radius:var(--radius-full);background:var(--color-background);font:inherit}
.main{max-width:72rem;margin:0 auto;padding:var(--space-lg)}
.form-group{display:flex;flex-direction:column;gap:var(--space-xs);margin-bottom:var(--space-md)}
.form-label{font-weight:600;font-size:var(--text-sm)}
.required{color:var(--color-error)}
.form-input,.form-textarea{width:100%;min-height:44px;padding:var(--space-sm) var(--space-md);border:1px solid var(--color-border-strong);border-radius:var(--radius-md);background:var(--color-surface);font:inherit;color:var(--color-text)}
.form-input:focus,.form-textarea:focus{outline:2px solid var(--color-primary);outline-offset:1px}
.form-hint{font-size:var(--text-xs);color:var(--color-text-secondary)}
.form-error{font-size:var(--text-sm);color:var(--color-error);font-weight:600}
.form-error[hidden],.empty-state[hidden]{display:none}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:var(--space-sm) var(--space-lg);border:none;border-radius:var(--radius-full);font:inherit;font-weight:600;cursor:pointer}
.btn--primary{background:var(--color-primary);color:var(--color-on-primary)}
.btn--primary:hover:not(:disabled){background:var(--color-primary-hover)}
.btn:disabled{background:var(--color-border-strong);color:var(--color-text);cursor:not-allowed}
.empty-state{text-align:center;padding:var(--space-2xl) var(--space-md);color:var(--color-text-secondary)}
.empty-state__icon{width:3.5rem;height:3.5rem;color:var(--color-primary-light);margin-bottom:var(--space-sm)}
.empty-state__title{color:var(--color-text);font-size:var(--text-lg)}

/* Shared page hero — used by Requests and Messages. Tokens from variables.css only. */

.page-hero {
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  gap: var(--space-lg);
  background: linear-gradient(135deg, var(--color-primary-hover), var(--color-primary));
  color: var(--color-on-primary);
  border-radius: var(--radius-xl);
  padding: var(--space-xl) var(--space-lg);
}

.page-hero::after {
  content: "";
  position: absolute;
  right: -3rem;
  bottom: -4rem;
  width: 12rem;
  height: 12rem;
  border-radius: var(--radius-full);
  background: var(--color-primary-light);
  opacity: 0.35;
  pointer-events: none;
}

.page-hero__text {
  position: relative;
  z-index: 1;
  max-width: 36rem;
}

.page-hero__title {
  font-size: var(--text-2xl);
  font-weight: 700;
  line-height: 1.2;
  margin-bottom: var(--space-sm);
}

.page-hero__subtitle {
  font-size: var(--text-base);
  line-height: 1.5;
}

.page-hero__btn {
  position: relative;
  z-index: 1;
  align-self: flex-start;
  min-height: 44px;
  padding: var(--space-sm) var(--space-lg);
  background: var(--color-surface);
  color: var(--color-primary);
  border: none;
  border-radius: var(--radius-full);
  font-family: inherit;
  font-size: var(--text-base);
  font-weight: 600;
  cursor: pointer;
  transition: background var(--transition-fast);
}

.page-hero__btn:hover {
  background: var(--color-lavender);
}

.page-hero__btn:focus-visible {
  outline: 3px solid var(--color-accent-yellow);
  outline-offset: 2px;
}

@media (min-width: 768px) {
  .page-hero {
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    padding: var(--space-2xl);
  }

  .page-hero__title {
    font-size: var(--text-3xl);
  }
}

@media (prefers-reduced-motion: reduce) {
  .page-hero__btn {
    transition: none;
  }
}

/* Requests page — uses design tokens from variables.css only */

/* Layout */
.requests-main {
  display: flex;
  flex-direction: column;
  gap: var(--space-lg);
}

.requests-status {
  min-height: 0;
  font-size: var(--text-sm);
  font-weight: 600;
  color: var(--color-success);
}

.requests-status:empty {
  display: none;
}

/* Post a request form */
.requests-form-section {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-xl);
  padding: var(--space-lg);
}

.requests-form-section[hidden] {
  display: none;
}

.requests-form__title {
  font-size: var(--text-xl);
  font-weight: 600;
  color: var(--color-text);
  margin-bottom: var(--space-md);
}

.requests-form__row {
  display: grid;
  grid-template-columns: 1fr;
  gap: var(--space-md);
}

.requests-form__actions {
  display: flex;
  justify-content: flex-end;
  margin-top: var(--space-md);
}

/* List header and category chips */
.requests-list__header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--space-md);
  margin-bottom: var(--space-md);
}

.requests-list__title {
  font-size: var(--text-xl);
  font-weight: 700;
  color: var(--color-text);
}

.requests-list__count {
  font-size: var(--text-sm);
  color: var(--color-text-secondary);
}

.requests-chips {
  display: flex;
  gap: var(--space-sm);
  overflow-x: auto;
  padding-bottom: var(--space-sm);
  margin-bottom: var(--space-md);
}

.requests-chip {
  flex: 0 0 auto;
  min-height: 44px;
  padding: var(--space-xs) var(--space-md);
  background: var(--color-surface);
  color: var(--color-text);
  border: 1px solid var(--color-border-strong);
  border-radius: var(--radius-full);
  font-family: inherit;
  font-size: var(--text-sm);
  font-weight: 600;
  cursor: pointer;
  transition: background var(--transition-fast), border-color var(--transition-fast);
}

.requests-chip:hover {
  background: var(--color-lavender-soft);
  border-color: var(--color-primary);
}

.requests-chip[aria-pressed="true"] {
  background: var(--color-primary);
  border-color: var(--color-primary);
  color: var(--color-on-primary);
}

.requests-chip:focus-visible {
  outline: 3px solid var(--color-primary);
  outline-offset: 2px;
}

/* Cards grid: one column on phones, more on larger screens */
.requests-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: var(--space-md);
}

/* Request card */
.request-card {
  display: flex;
  flex-direction: column;
  gap: var(--space-sm);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-left: 4px solid var(--color-primary);
  border-radius: var(--radius-lg);
  padding: var(--space-md);
  box-shadow: var(--shadow-sm);
  transition: box-shadow var(--transition-base), transform var(--transition-base);
}

.request-card:hover {
  box-shadow: var(--shadow-md);
  transform: translateY(-2px);
}

.request-card--mine {
  background: var(--color-lavender-soft);
}

.request-card--highlight {
  border-color: var(--color-primary);
  box-shadow: 0 0 0 3px var(--color-lavender);
}

.request-card__tags {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-sm);
}

.request-card__category {
  background: var(--color-lavender);
  color: var(--color-primary);
  border-radius: var(--radius-full);
  padding: var(--space-xs) var(--space-sm);
  font-size: var(--text-xs);
  font-weight: 600;
}

.request-card__badge {
  border-radius: var(--radius-full);
  padding: var(--space-xs) var(--space-sm);
  font-size: var(--text-xs);
  font-weight: 600;
}

.request-card__badge--new {
  background: var(--color-accent-mint);
  color: var(--color-text);
}

.request-card__badge--mine {
  background: var(--color-primary);
  color: var(--color-on-primary);
}

.request-card__title {
  font-size: var(--text-lg);
  font-weight: 700;
  line-height: 1.3;
  color: var(--color-text);
}

.request-card__budget {
  display: flex;
  align-items: baseline;
  gap: var(--space-sm);
}

.request-card__budget-label {
  font-size: var(--text-xs);
  color: var(--color-text-secondary);
}

.request-card__budget-amount {
  font-size: var(--text-2xl);
  font-weight: 700;
  color: var(--color-primary);
}

.request-card__description {
  display: -webkit-box;
  -webkit-line-clamp: 3;
  line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
  font-size: var(--text-sm);
  line-height: 1.5;
  color: var(--color-text-secondary);
}

.request-card__footer {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-sm);
  margin-top: auto;
  padding-top: var(--space-sm);
  border-top: 1px solid var(--color-border);
}

.request-card__time {
  font-size: var(--text-xs);
  color: var(--color-text-secondary);
}

.request-card__action {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  padding: var(--space-xs) var(--space-md);
  background: var(--color-primary);
  color: var(--color-on-primary);
  border: 1px solid var(--color-primary);
  border-radius: var(--radius-full);
  font-family: inherit;
  font-size: var(--text-sm);
  font-weight: 600;
  text-decoration: none;
  cursor: pointer;
  transition: background var(--transition-fast);
}

.request-card__action:hover {
  background: var(--color-primary-hover);
}

.request-card__action--ghost {
  background: transparent;
  color: var(--color-error);
  border-color: var(--color-border-strong);
}

.request-card__action--ghost:hover {
  background: var(--color-error-bg);
}

.request-card__action:focus-visible {
  outline: 3px solid var(--color-primary);
  outline-offset: 2px;
}

/* Tablet and up */
@media (min-width: 768px) {
  .requests-form__row {
    grid-template-columns: 1fr 1fr;
  }

  .requests-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (min-width: 1024px) {
  .requests-grid {
    grid-template-columns: repeat(3, 1fr);
  }
}

/* Respect reduced motion */
@media (prefers-reduced-motion: reduce) {
  .request-card,
  .requests-chip,
  .request-card__action {
    transition: none;
  }

  .request-card:hover {
    transform: none;
  }
}
</style>
</head>
<body>
<header class="header">
  <div class="header__topbar">
    <a href="#" class="header__logo">ReDeal</a>
    <nav class="header__nav" aria-label="Primary navigation">
      <a href="#" class="header__nav-link">Home</a><a href="#" class="header__nav-link">Marketplace</a>
      <a href="#" class="header__nav-link" aria-current="page">Requests</a><a href="#" class="header__nav-link">Messages</a><a href="#" class="header__nav-link">Profile</a>
    </nav>
  </div>
  <div class="header__search"><input type="search" id="request-search" class="header__search-input" placeholder="Search requests..." aria-label="Search requests"></div>
</header>
<main id="main" class="main requests-main" role="main">
    <!-- Hero -->
    <section class="page-hero" aria-labelledby="requests-hero-title">
      <div class="page-hero__text">
        <h1 id="requests-hero-title" class="page-hero__title">Can't find it? Request it.</h1>
        <p class="page-hero__subtitle">Tell students what you're looking for and let sellers come to you.</p>
      </div>
      <button type="button" class="page-hero__btn" id="toggle-form-btn" aria-expanded="false" aria-controls="request-form-section">Post a request</button>
    </section>
    <p class="requests-status" id="request-status" role="status"></p>

    <!-- Post a Request -->
    <section class="requests-form-section" id="request-form-section" aria-labelledby="post-request-title" hidden>
      <h2 id="post-request-title" class="requests-form__title">Post a request</h2>
      <form id="request-form" class="requests-form" novalidate>
        <div class="form-group">
          <label for="request-title" class="form-label">What are you looking for? <span class="required" aria-hidden="true">*</span></label>
          <input type="text" id="request-title" name="title" class="form-input" placeholder="e.g., Calculus textbook" required maxlength="80" autocomplete="off" aria-describedby="request-title-error request-title-hint">
          <div id="request-title-error" class="form-error" role="alert" aria-live="polite" hidden></div>
          <span id="request-title-hint" class="form-hint">5-80 characters</span>
        </div>

        <div class="requests-form__row">
          <div class="form-group">
            <label for="request-category" class="form-label">Category <span class="required" aria-hidden="true">*</span></label>
            <select id="request-category" name="category" class="form-input form-select" required aria-describedby="request-category-error">
              <option value="">Select category</option>
            </select>
            <div id="request-category-error" class="form-error" role="alert" aria-live="polite" hidden></div>
          </div>
          <div class="form-group">
            <label for="request-budget" class="form-label">Budget (₱) <span class="required" aria-hidden="true">*</span></label>
            <input type="number" id="request-budget" name="budget" class="form-input" placeholder="e.g., 500" required min="1" step="1" autocomplete="off" aria-describedby="request-budget-error">
            <div id="request-budget-error" class="form-error" role="alert" aria-live="polite" hidden></div>
          </div>
        </div>

        <div class="form-group">
          <label for="request-description" class="form-label">Details <span class="required" aria-hidden="true">*</span></label>
          <textarea id="request-description" name="description" class="form-textarea" rows="3" placeholder="Brand, size, condition, preferred meetup spot..." required maxlength="500" aria-describedby="request-description-error request-description-hint"></textarea>
          <div id="request-description-error" class="form-error" role="alert" aria-live="polite" hidden></div>
          <span id="request-description-hint" class="form-hint">10-500 characters</span>
        </div>

        <div class="requests-form__actions">
          <button type="submit" class="btn btn--primary btn--lg" id="request-submit" disabled aria-disabled="true">Post Request</button>
        </div>
      </form>
    </section>

    <!-- Open Requests -->
    <section class="marketplace-grid-section" aria-labelledby="requests-title">
      <div class="requests-list__header">
        <h2 id="requests-title" class="requests-list__title">Open requests</h2>
        <span class="requests-list__count" id="requests-count" aria-live="polite"></span>
      </div>
      <div class="requests-chips" id="request-chips" role="group" aria-label="Filter by category"></div>
      <div class="requests-grid" id="requests-list"></div>
      <div class="empty-state" id="requests-empty" hidden>
        <svg class="empty-state__icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <path d="M14 2v6h6"/>
          <path d="M16 13H8"/>
          <path d="M16 17H8"/>
          <path d="M10 9H8"/>
        </svg>
        <h3 class="empty-state__title" id="requests-empty-title">No requests yet</h3>
        <p class="empty-state__description" id="requests-empty-message">Post what you're looking for and sellers can reach out.</p>
      </div>
    </section>
  </main>
<script>
// Requests page: post, browse, search, and delete item requests.
// Data is stored in the browser (localStorage) because ReDeal has no backend.

// 1. Constants / configuration
const STORAGE_KEY = 'redeal.requests';
const CATEGORIES = ['Books', 'Electronics', 'Clothing', 'Furniture', 'School supplies', 'Other'];
const DAY_MS = 24 * 60 * 60 * 1000;

const LIMITS = {
  title: { min: 5, max: 80 },
  description: { min: 10, max: 500 }
};

const SEED_REQUESTS = [
  {
    id: 'seed-1',
    title: 'Calculus textbook (Stewart, 8th edition)',
    category: 'Books',
    budget: 600,
    description: 'Used is fine as long as the pages are intact. Can meet near the library.',
    createdAt: Date.now() - 2 * DAY_MS,
    mine: false
  },
  {
    id: 'seed-2',
    title: 'Mini fridge for dorm',
    category: 'Furniture',
    budget: 1800,
    description: 'Looking for a working mini fridge, around 50 liters. Pickup only.',
    createdAt: Date.now() - 5 * DAY_MS,
    mine: false
  },
  {
    id: 'seed-3',
    title: 'Scientific calculator (Casio fx-991)',
    category: 'School supplies',
    budget: 700,
    description: 'Needed for the coming exams. Must be in working condition.',
    createdAt: Date.now() - 1 * DAY_MS,
    mine: false
  }
];

// 2. DOM references
const form = document.getElementById('request-form');
const submitBtn = document.getElementById('request-submit');
const listEl = document.getElementById('requests-list');
const countEl = document.getElementById('requests-count');
const emptyEl = document.getElementById('requests-empty');
const emptyTitleEl = document.getElementById('requests-empty-title');
const emptyMessageEl = document.getElementById('requests-empty-message');
const searchEl = document.getElementById('request-search');
const formSection = document.getElementById('request-form-section');
const toggleBtn = document.getElementById('toggle-form-btn');
const chipsEl = document.getElementById('request-chips');
const statusEl = document.getElementById('request-status');

const fields = {
  title: document.getElementById('request-title'),
  category: document.getElementById('request-category'),
  budget: document.getElementById('request-budget'),
  description: document.getElementById('request-description')
};

const errorEls = {
  title: document.getElementById('request-title-error'),
  category: document.getElementById('request-category-error'),
  budget: document.getElementById('request-budget-error'),
  description: document.getElementById('request-description-error')
};

// 3. State
let requests = loadRequests();
let searchTerm = '';
let activeCategory = 'All';
let highlightId = null;
const touched = new Set();

// 4. Storage helpers
function loadRequests() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) return JSON.parse(saved);
  } catch (error) {
    console.warn('Could not read saved requests:', error);
  }
  return [...SEED_REQUESTS];
}

function saveRequests() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(requests));
  } catch (error) {
    console.warn('Could not save requests:', error);
  }
}

// 5. Validation
function validateField(name) {
  const value = fields[name].value.trim();

  switch (name) {
    case 'title':
      if (value.length < LIMITS.title.min) return `Title must be at least ${LIMITS.title.min} characters.`;
      if (value.length > LIMITS.title.max) return `Title must be ${LIMITS.title.max} characters or fewer.`;
      return '';
    case 'category':
      return value ? '' : 'Choose a category.';
    case 'budget': {
      const amount = Number(value);
      if (!value) return 'Enter your budget.';
      if (!Number.isInteger(amount) || amount < 1) return 'Budget must be a whole number of at least 1.';
      return '';
    }
    case 'description':
      if (value.length < LIMITS.description.min) return `Details must be at least ${LIMITS.description.min} characters.`;
      if (value.length > LIMITS.description.max) return `Details must be ${LIMITS.description.max} characters or fewer.`;
      return '';
    default:
      return '';
  }
}

function showError(name, message) {
  const el = errorEls[name];
  el.textContent = message;
  el.hidden = !message;
  fields[name].setAttribute('aria-invalid', message ? 'true' : 'false');
}

function updateFormState() {
  let allValid = true;

  Object.keys(fields).forEach((name) => {
    const message = validateField(name);
    if (message) allValid = false;
    // Only show an error after the person has interacted with the field.
    showError(name, touched.has(name) ? message : '');
  });

  submitBtn.disabled = !allValid;
  submitBtn.setAttribute('aria-disabled', String(!allValid));
}

// 6. Rendering (uses textContent so user input can never inject HTML)
function formatTimeAgo(timestamp) {
  const days = Math.floor((Date.now() - timestamp) / DAY_MS);
  if (days <= 0) return 'Posted today';
  if (days === 1) return 'Posted yesterday';
  return `Posted ${days} days ago`;
}

function formatPeso(amount) {
  return `₱${Number(amount).toLocaleString('en-PH')}`;
}

function createElement(tag, className, text) {
  const el = document.createElement(tag);
  if (className) el.className = className;
  if (text !== undefined) el.textContent = text;
  return el;
}

function createRequestCard(request) {
  const isNew = Date.now() - request.createdAt < DAY_MS;
  const card = createElement('article', 'request-card');
  card.dataset.requestId = request.id;
  if (request.mine) card.classList.add('request-card--mine');
  if (request.id === highlightId) card.classList.add('request-card--highlight');

  const tags = createElement('div', 'request-card__tags');
  tags.append(createElement('span', 'request-card__category', request.category));
  if (isNew) tags.append(createElement('span', 'request-card__badge request-card__badge--new', 'New'));
  if (request.mine) tags.append(createElement('span', 'request-card__badge request-card__badge--mine', 'Your request'));

  const title = createElement('h3', 'request-card__title', request.title);

  const budget = createElement('p', 'request-card__budget');
  budget.append(
    createElement('span', 'request-card__budget-label', 'Budget'),
    createElement('strong', 'request-card__budget-amount', formatPeso(request.budget))
  );

  const description = createElement('p', 'request-card__description', request.description);

  const footer = createElement('div', 'request-card__footer');
  footer.append(createElement('span', 'request-card__time', formatTimeAgo(request.createdAt)));

  if (request.mine) {
    const deleteBtn = createElement('button', 'request-card__action request-card__action--ghost', 'Delete');
    deleteBtn.type = 'button';
    deleteBtn.dataset.action = 'delete';
    deleteBtn.setAttribute('aria-label', `Delete request: ${request.title}`);
    footer.append(deleteBtn);
  } else {
    const messageLink = createElement('a', 'request-card__action', 'I have this');
    messageLink.href = 'messages.html';
    messageLink.setAttribute('aria-label', `Message the buyer about: ${request.title}`);
    footer.append(messageLink);
  }

  card.append(tags, title, budget, description, footer);
  return card;
}

function getVisibleRequests() {
  const term = searchTerm.trim().toLowerCase();
  return [...requests]
    .sort((a, b) => b.createdAt - a.createdAt)
    .filter((r) => activeCategory === 'All' || r.category === activeCategory)
    .filter((r) => {
      if (!term) return true;
      return [r.title, r.category, r.description].join(' ').toLowerCase().includes(term);
    });
}

function renderRequests() {
  const visible = getVisibleRequests();

  listEl.replaceChildren(...visible.map(createRequestCard));
  countEl.textContent = `${visible.length} ${visible.length === 1 ? 'request' : 'requests'}`;

  const isEmpty = visible.length === 0;
  emptyEl.hidden = !isEmpty;

  if (isEmpty) {
    const isSearching = searchTerm.trim() !== '' || activeCategory !== 'All';
    emptyTitleEl.textContent = isSearching ? 'No matching requests' : 'No requests yet';
    emptyMessageEl.textContent = isSearching
      ? 'Try a different search or category.'
      : "Post what you're looking for and sellers can reach out.";
  }
}

function renderChips() {
  const buttons = ['All', ...CATEGORIES].map((name) => {
    const chip = createElement('button', 'requests-chip', name);
    chip.type = 'button';
    chip.dataset.category = name;
    chip.setAttribute('aria-pressed', String(name === activeCategory));
    return chip;
  });
  chipsEl.replaceChildren(...buttons);
}

function setFormOpen(isOpen) {
  formSection.hidden = !isOpen;
  toggleBtn.setAttribute('aria-expanded', String(isOpen));
  toggleBtn.textContent = isOpen ? 'Close form' : 'Post a request';
  if (isOpen) fields.title.focus();
}

function showStatus(message) {
  statusEl.textContent = message;
  setTimeout(() => { statusEl.textContent = ''; }, 4000);
}

// 7. Event handlers
function handleSubmit(event) {
  event.preventDefault();

  Object.keys(fields).forEach((name) => touched.add(name));
  updateFormState();
  if (submitBtn.disabled) return;

  requests.push({
    id: `req-${Date.now()}`,
    title: fields.title.value.trim(),
    category: fields.category.value,
    budget: Number(fields.budget.value),
    description: fields.description.value.trim(),
    createdAt: Date.now(),
    mine: true
  });

  highlightId = requests[requests.length - 1].id;
  saveRequests();
  form.reset();
  touched.clear();
  updateFormState();
  setFormOpen(false);
  activeCategory = 'All';
  searchTerm = '';
  if (searchEl) searchEl.value = '';
  renderChips();
  renderRequests();
  showStatus('Request posted. Sellers can now see it.');

  const newCard = listEl.querySelector(`[data-request-id="${highlightId}"]`);
  if (newCard) {
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    newCard.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'center' });
  }
  setTimeout(() => {
    highlightId = null;
    if (newCard) newCard.classList.remove('request-card--highlight');
  }, 4000);
}

function handleListClick(event) {
  const deleteBtn = event.target.closest('[data-action="delete"]');
  if (!deleteBtn) return;

  const card = deleteBtn.closest('[data-request-id]');
  if (!card) return;

  requests = requests.filter((r) => r.id !== card.dataset.requestId);
  saveRequests();
  renderRequests();
}

function handleChipClick(event) {
  const chip = event.target.closest('[data-category]');
  if (!chip) return;
  activeCategory = chip.dataset.category;
  renderChips();
  renderRequests();
}

function handleFieldActivity(event) {
  const name = event.target.name;
  if (!(name in fields)) return;
  if (event.type === 'blur' || event.type === 'change') touched.add(name);
  updateFormState();
}

function debounce(fn, delay) {
  let timer;
  return (...args) => {
    clearTimeout(timer);
    timer = setTimeout(() => fn(...args), delay);
  };
}

// 8. Initialization
function init() {
  CATEGORIES.forEach((name) => {
    const option = createElement('option', '', name);
    option.value = name;
    fields.category.append(option);
  });

  form.addEventListener('submit', handleSubmit);
  form.addEventListener('input', handleFieldActivity);
  form.addEventListener('change', handleFieldActivity);
  form.addEventListener('focusout', handleFieldActivity);
  listEl.addEventListener('click', handleListClick);
  chipsEl.addEventListener('click', handleChipClick);
  toggleBtn.addEventListener('click', () => setFormOpen(formSection.hidden));

  if (searchEl) {
    searchEl.addEventListener('input', debounce(() => {
      searchTerm = searchEl.value;
      renderRequests();
    }, 200));
  }

  updateFormState();
  renderChips();
  renderRequests();
}

init();

</script>
</body>
</html>
